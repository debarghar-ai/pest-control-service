
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PestCare - Login & Register</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">

      <div class="logo">
        <h2>🐜 PestCare</h2>
        <p>Your trusted pest control partner</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
          Login
        </button>
        <button class="tab" id="registerTab" type="button">
          Register
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to your PestCare account</p>

        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail"
               placeholder="Enter your email" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword"
               placeholder="Enter your password" required>

        <button type="submit" class="submit-btn">Login</button>

        <p class="switch-text">
          Don't have an account?
          <a href="#" id="showRegister">Register Now</a>
        </p>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form hidden">
        <h2>Create Account</h2>
        <p class="subtitle">Join PestCare today</p>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName"
               placeholder="Enter your full name" required>

        <label for="registerEmail">Email Address</label>
        <input type="email" id="registerEmail"
               placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone"
               placeholder="Enter your phone number"
               pattern="[0-9+\-\s]{7,15}" required>

        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword"
               placeholder="Create a password"
               minlength="8" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Confirm your password"
               minlength="8" required>

        <button type="submit" class="submit-btn">
          Create Account
        </button>

        <p class="switch-text">
          Already have an account?
          <a href="#" id="showLogin">Login Now</a>
        </p>
      </form>

      <p id="message" class="message" aria-live="polite"></p>

      <a href="index.html" class="home-link">← Back to Home</a>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
